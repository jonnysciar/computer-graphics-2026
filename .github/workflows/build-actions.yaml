name: build-actions
run-name: Build
on: [ push ]
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      TZ: "Europe/Rome"
    steps:
      - uses: actions/checkout@v6
      - name: Update
        run: sudo apt update
      - name: Install dependencies
        run: sudo apt install -y cmake ninja-build build-essential clang-format git pkg-config libvulkan-dev glslang-dev
             libglfw3-dev libglm-dev glslang-tools glslc
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build
